{% extends "base.html" %}
{% block content %}
<h1>导入面试复盘</h1>
<p class="muted">三步：① 基本信息 → ② 粘贴转写文本并确认说话人角色 → ③ 创建并解析。</p>

<div id="errbox" class="flash err wrap" style="display:none"></div>

<section class="card">
  <h2>① 基本信息</h2>
  <div class="grid2">
    <label>公司 <input id="f-company" placeholder="如：字节跳动"></label>
    <label>岗位 <input id="f-position" placeholder="如：后端工程师"></label>
    <label>面试类型
      <select id="f-type">
        {% for k, v in interview_types.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
      </select>
    </label>
    <label>日期 <input id="f-date" type="date"></label>
  </div>
</section>

<section class="card">
  <h2>② 转写文本与说话人角色</h2>
  <p class="muted">支持常见说话人标签：<code>[面试官] …</code>、<code>面试官：…</code>、<code>A：…</code>、<code>Speaker 0：…</code>。无标签文本将由系统按内容推断角色（可逐段修正）。</p>
  <textarea id="f-text" rows="12" placeholder="粘贴面试录音的转写文本（可含说话人标签）……"></textarea>
  <div class="row">
    <button class="btn" id="btn-sample">载入示例文本</button>
    <button class="btn primary" id="btn-analyze">识别说话人与格式 →</button>
    <span class="muted" id="analyze-info"></span>
  </div>

  <div id="analyze-result" style="display:none">
    <h3>说话人角色确认 <span class="muted small">（系统不猜测——请核对后进入下一步，R1）</span></h3>
    <p id="fmt-line" class="muted"></p>
    <table class="tbl" id="speaker-table">
      <thead><tr><th>说话人</th><th>来源</th><th>置信度</th><th>角色</th><th>内容片段</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="row">
      <button class="btn primary" id="btn-create">③ 创建并解析 →</button>
      <span class="muted" id="create-info"></span>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
const $ = (id) => document.getElementById(id);
function showErr(msg){ const b=$('errbox'); b.textContent=msg; b.style.display='block'; window.scrollTo(0,0); }
function hideErr(){ $('errbox').style.display='none'; }

$('f-date').value = new Date().toISOString().slice(0,10);

$('btn-sample').addEventListener('click', async () => {
  const r = await fetch('/static/sample_transcript.txt');
  $('f-text').value = await r.text();
  hideErr();
});

let text = '', speakers = [];

$('btn-analyze').addEventListener('click', async () => {
  text = $('f-text').value.trim();
  if(!text) return showErr('请先粘贴或载入转写文本。');
  hideErr();
  const btn = $('btn-analyze'); btn.disabled = true; $('analyze-info').textContent = '识别中…';
  try {
    const r = await fetch('/api/analyze', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})});
    const data = await r.json();
    if(!r.ok) { showErr(data.error || '识别失败'); return; }
    speakers = data.speakers || [];
    $('analyze-result').style.display = 'block';
    $('fmt-line').textContent = `文本格式：${data.format_label}（${data.chars} 字符，${data.turns} 个轮次）；当前解析器：${data.extractor_label}`;
    const tbody = $('speaker-table').querySelector('tbody');
    tbody.innerHTML = '';
    for(const sp of speakers){
      const tr = document.createElement('tr');
      const roleSel = ['interviewer','self','other','unknown'].map(v => {
        const sel = v === sp.role;
        const names = {interviewer:'面试官(提问)', self:'我(回答)', other:'其他/无关', unknown:'待定'};
        return `<option value="${v}"${sel?' selected':''}>${names[v]}</option>`;
      }).join('');
      tr.innerHTML = `
        <td><b>${sp.label}</b></td>
        <td><span class="chip">${sp.source==='label' ? '标签直读' : '内容推断'}</span></td>
        <td>${Math.round((sp.confidence||0)*100)}%</td>
        <td><select class="role-sel">${roleSel}</select></td>
        <td class="muted small">${sp.sample || ''}</td>`;
      tbody.appendChild(tr);
    }
    if(data.format === 'none'){
      $('fmt-line').textContent += ' ｜ ⚠ 无标签文本：角色为低置信推断，请逐段核对（真实推断建议配置 DEEPSEEK_API_KEY）。';
    }
  } catch(e){ showErr('网络错误：' + e.message); }
  finally { btn.disabled = false; $('analyze-info').textContent=''; }
});

$('btn-create').addEventListener('click', async () => {
  const meta = {
    company: $('f-company').value.trim(),
    position: $('f-position').value.trim(),
    interview_type: $('f-type').value,
    date: $('f-date').value,
  };
  const role_map = {};
  document.querySelectorAll('#speaker-table tbody tr').forEach((tr, i) => {
    if(speakers[i]) role_map[speakers[i].label] = tr.querySelector('.role-sel').value;
  });
  const btn = $('btn-create'); btn.disabled = true; $('create-info').textContent = '解析中（长文本可能需要一段时间）…';
  try {
    const r = await fetch('/api/interviews', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({...meta, text, role_map})});
    const data = await r.json();
    if(!r.ok) { showErr(data.error || '创建失败'); return; }
    location.href = '/interviews/' + data.interview_id + '?ok=' + encodeURIComponent(
      `已提取 ${data.qa_count} 个问答` + (data.pending_count ? `（其中 ${data.pending_count} 个待确认）` : ''));
  } catch(e){ showErr('网络错误：' + e.message); }
  finally { btn.disabled = false; $('create-info').textContent=''; }
});
</script>
{% endblock %}
